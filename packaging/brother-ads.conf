# Konfiguration für "brother-ads buttons" (Scan-Taste am ADS-2100e)

[scanner]
output_dir = /srv/scans
# strftime-Muster, Endung wird automatisch angehängt
filename = scan_%Y-%m-%d_%H-%M-%S
poll_interval = 1.0

# Standardprofil für alle Tastenfunktionen
[profile]
# color-jpeg | color | gray | bw | halftone
mode = color-jpeg
# 100 150 200 300 400 600
resolution = 300
# a4 a5 a6 letter legal b5 card max  oder z. B. 210x297
paper = a4
# device = Duplex-Einstellung des Geräts übernehmen, sonst yes/no
duplex = yes
# pdf jpg png tiff
format = pdf
brightness = 0
contrast = 0
# Rückseiten im Duplex drehen (0/90/180/270), falls sie kopfüber erscheinen
back_rotate = 0
jpeg_quality = 85
# Optionaler Befehl nach dem Scan; {file}, {files}, {function} werden ersetzt
# Leere Seiten entfernen und Seiten ausrichten (siehe brother-ads-postscan --help)
command = /usr/local/bin/brother-ads-postscan {file}

# Abweichende Einstellungen je Tastenfunktion (file, image, ocr, email)
[profile.ocr]
mode = gray
